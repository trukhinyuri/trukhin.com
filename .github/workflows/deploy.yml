name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Publish-Id trailer on main
        id: trailer
        run: |
          MSG=$(git log -1 --format=%B)
          PUB_ID=$(echo "$MSG" | sed -n 's/^Publish-Id: \([0-9a-f]\{16\}\)$/\1/p' | tail -n 1)
          if [ -z "$PUB_ID" ]; then
            echo "STOP: HEAD commit on main has no Publish-Id trailer; refusing to deploy." >&2
            exit 1
          fi
          echo "publish_id=$PUB_ID" >> "$GITHUB_OUTPUT"
          echo "Verified Publish-Id trailer: $PUB_ID"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Run checks
        run: npm run check

      - name: Run unit tests
        run: node --test tests/*.test.mjs

      - name: Verify manifest
        run: |
          OUT=$(node tools/manifest.mjs)
          echo "$OUT"
          BUILT_ID=$(echo "$OUT" | awk '/^id / {print $2}')
          echo "### Deployed Manifest" >> "$GITHUB_STEP_SUMMARY"
          echo "- Approved \`Publish-Id\`: \`${{ steps.trailer.outputs.publish_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Built \`id\`: \`$BUILT_ID\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
